<svg xmlns="http://www.w3.org/2000/svg" width="970" height="720" viewBox="0 0 970 720" role="img" aria-labelledby="title desc">
  <title id="title">Flex task attributes sample</title>
  <desc id="desc">A sanitized example of a Twilio Flex task panel showing an Attributes tab with task context from a LiveKit AI escalation.</desc>
  <defs>
    <style>
      .bg { fill: #f4f6fb; }
      .nav { fill: #090033; }
      .sidebar { fill: #ffffff; stroke: #d8dde8; }
      .panel { fill: #ffffff; stroke: #d8dde8; }
      .muted-panel { fill: #f8f9fc; stroke: #d8dde8; }
      .text { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #172033; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #5f6b7a; }
      .blue { fill: #0b65ff; }
      .line { stroke: #e4e9f1; stroke-width: 1; }
      .button { fill: #ffffff; stroke: #ccd5e1; }
      .danger { fill: #d61f3c; }
      .type { fill: #0b65ff; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="970" height="720" rx="0"/>
  <rect class="nav" width="970" height="52"/>
  <text x="26" y="33" class="text" fill="#ffffff" font-size="20">☰</text>
  <text x="92" y="32" class="text" fill="#ffffff" font-size="14" letter-spacing="4">TWILIO FLEX</text>

  <rect x="0" y="52" width="58" height="668" class="sidebar"/>
  <text x="24" y="84" class="blue text" font-size="18">◆</text>
  <text x="23" y="135" class="text" font-size="17">♙</text>
  <text x="23" y="188" class="text" font-size="17">▣</text>
  <text x="23" y="241" class="text" font-size="17">▤</text>
  <text x="23" y="294" class="text" font-size="17">▥</text>
  <text x="23" y="347" class="text" font-size="17">☷</text>

  <rect x="58" y="52" width="320" height="668" class="muted-panel"/>
  <text x="78" y="84" class="blue text" font-size="19">⌕</text>
  <text x="114" y="75" class="text" font-size="15" font-weight="700">LiveKit AI escalation</text>
  <text x="114" y="96" class="muted text" font-size="13">Live | 00:45</text>
  <line x1="58" y1="112" x2="378" y2="112" class="line"/>
  <text x="74" y="135" class="text" font-size="14">All Tasks⌄</text>
  <text x="289" y="135" class="blue text" font-size="14" font-weight="700">+ New task</text>

  <rect x="378" y="52" width="592" height="668" class="panel"/>
  <text x="394" y="75" class="text" font-size="16" font-weight="800">LiveKit AI escalation</text>
  <text x="394" y="96" class="muted text" font-size="13">Live | 00:45</text>
  <rect x="858" y="58" width="85" height="38" rx="5" class="danger"/>
  <text x="900" y="82" class="text" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Hang Up</text>

  <line x1="378" y1="139" x2="970" y2="139" class="line"/>
  <text x="404" y="126" class="muted text" font-size="14" font-weight="700">Call</text>
  <text x="487" y="126" class="muted text" font-size="14" font-weight="700">Notes</text>
  <text x="569" y="126" class="muted text" font-size="14" font-weight="700">Info</text>
  <text x="630" y="126" class="blue text" font-size="14" font-weight="800">Attributes</text>
  <rect x="628" y="137" width="76" height="3" class="blue"/>

  <text x="391" y="169" class="text" font-size="14" font-weight="800">33 attributes</text>
  <rect x="858" y="152" width="82" height="24" rx="4" class="button"/>
  <text x="899" y="168" class="text" font-size="12" text-anchor="middle">Raw JSON</text>
  <rect x="391" y="188" width="548" height="29" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="402" y="207" class="muted text" font-size="13">Filter by key path or value</text>

  <g font-size="13">
    <line x1="391" y1="228" x2="939" y2="228" class="line"/>
    <text x="413" y="248" class="mono">account_sid : ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</text>
    <text x="899" y="248" class="type">STRING</text>
    <line x1="391" y1="258" x2="939" y2="258" class="line"/>
    <text x="413" y="278" class="mono">call_sid : CAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</text>
    <text x="899" y="278" class="type">STRING</text>
    <line x1="391" y1="288" x2="939" y2="288" class="line"/>
    <text x="413" y="308" class="mono">called : +15551234567</text>
    <text x="899" y="308" class="type">STRING</text>
    <line x1="391" y1="318" x2="939" y2="318" class="line"/>
    <text x="413" y="338" class="mono">caller : +15557654321</text>
    <text x="899" y="338" class="type">STRING</text>
    <line x1="391" y1="348" x2="939" y2="348" class="line"/>
    <text x="413" y="368" class="mono">channelType : voice</text>
    <text x="899" y="368" class="type">STRING</text>
    <line x1="391" y1="378" x2="939" y2="378" class="line"/>
    <text x="413" y="398" class="mono">description : Caller is locked out and cannot access email</text>
    <text x="899" y="398" class="type">STRING</text>
    <line x1="391" y1="408" x2="939" y2="408" class="line"/>
    <text x="413" y="428" class="mono">direction : inbound</text>
    <text x="899" y="428" class="type">STRING</text>
    <line x1="391" y1="438" x2="939" y2="438" class="line"/>
    <text x="413" y="458" class="mono">from : +15557654321</text>
    <text x="899" y="458" class="type">STRING</text>
    <line x1="391" y1="468" x2="939" y2="468" class="line"/>
    <text x="413" y="488" class="mono">handoffId : CAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</text>
    <text x="899" y="488" class="type">STRING</text>
    <line x1="391" y1="498" x2="939" y2="498" class="line"/>
    <text x="413" y="518" class="mono">intent : account_access</text>
    <text x="899" y="518" class="type">STRING</text>
    <line x1="391" y1="528" x2="939" y2="528" class="line"/>
    <text x="413" y="548" class="mono">name : LiveKit AI escalation</text>
    <text x="899" y="548" class="type">STRING</text>
    <line x1="391" y1="558" x2="939" y2="558" class="line"/>
    <text x="413" y="578" class="mono">parentCallSid : CAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</text>
    <text x="899" y="578" class="type">STRING</text>
    <line x1="391" y1="588" x2="939" y2="588" class="line"/>
    <text x="413" y="608" class="mono">reason : ai_escalation</text>
    <text x="899" y="608" class="type">STRING</text>
    <line x1="391" y1="618" x2="939" y2="618" class="line"/>
    <text x="413" y="638" class="mono">summary : Caller tried a sign-in code and still needs help</text>
    <text x="899" y="638" class="type">STRING</text>
  </g>
</svg>
